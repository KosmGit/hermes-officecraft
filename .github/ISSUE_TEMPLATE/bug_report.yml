name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here: see the security policy of this repository.
        Please remove real card titles, bot names and keys from what you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Officecraft
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Officecraft version or commit
      placeholder: 0.1.0, or the commit you installed
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      placeholder: output of `hermes --version`
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hermes Desktop
        - Hermes Webapp (browser)
        - Both
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshot, console errors, whether the agent half is installed on the backend.
