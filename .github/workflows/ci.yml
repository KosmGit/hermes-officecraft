name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# One run per branch: a newer push cancels the older run of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Node 22 runs everything. Node 20 only rebuilds the bundle: `node --test` does not expand globs before Node 21,
    # and what must hold on both is that the committed desktop/plugin.js is reproduced byte for byte.
    name: desktop (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci --prefix dev --ignore-scripts
      - name: bundle is reproduced from src/ (same bytes on every Node)
        run: npm --prefix dev run build && git diff --exit-code -- desktop/plugin.js
      - name: verify (bundle up to date, imports, colours, node tests incl. size and versions)
        if: matrix.node == 22
        run: npm --prefix dev run verify

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/python
